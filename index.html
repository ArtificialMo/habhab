<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Car Boy</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #202225;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      /* Portrait 9:16 play surface, letterboxed on wide screens (§2.3). */
      #stage {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #frame {
        position: relative;
        height: 100%;
        aspect-ratio: 9 / 16;
        max-width: 100%;
        background: linear-gradient(
          to bottom,
          #1f6fd0 0%,
          #3f95e6 32%,
          #71bdf3 58%,
          #a8dcf7 76%,
          #cfeaf6 100%
        );
        overflow: hidden;
      }
      #render {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        outline: none;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div id="stage"><div id="frame"><canvas id="render"></canvas></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
