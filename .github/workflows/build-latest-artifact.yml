name: Build latest CARBOY artifact

on:
  push:
    branches:
      - chatgpt/build-latest-artifact

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/build-latest-artifact
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Save fresh standalone artifact
        run: cp dist/carboy-artifact.html public/carboy-artifact-latest.html
      - name: Commit generated artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/carboy-artifact-latest.html
          git diff --cached --quiet || git commit -m "Build latest standalone CARBOY artifact"
          git push
