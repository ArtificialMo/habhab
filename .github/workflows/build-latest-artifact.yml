name: Build latest CARBOY artifact to main

on:
  push:
    branches:
      - chatgpt/build-latest-artifact

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Replace stale standalone artifact on main
        run: cp dist/carboy-artifact.html public/carboy-artifact.html
      - name: Commit fresh artifact to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/carboy-artifact.html
          if git diff --cached --quiet; then
            echo "Standalone artifact already matches latest source."
          else
            git commit -m "Rebuild standalone CARBOY artifact from latest source"
            git push origin HEAD:main
          fi
