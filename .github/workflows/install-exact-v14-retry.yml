name: Install exact uploaded CARBOY V14 retry

on:
  push:
    branches:
      - chatgpt/build-latest-artifact
    paths:
      - .github/workflows/install-exact-v14-retry.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download exact uploaded V14
        run: |
          set -euo pipefail
          mkdir -p public
          curl -fL --retry 4 --retry-all-errors --connect-timeout 20 --max-time 180 \
            'https://filebin.net/carboy-v14-20260807-retry/CARBOY_V14.html' \
            -o public/CARBOY_V14.html

      - name: Verify V14 byte identity
        run: |
          set -euo pipefail
          test "$(wc -c < public/CARBOY_V14.html)" = '2459760'
          echo '2d715c4c21839529615ee9d051ba2bad3258e087a94dfaff376bc993fbe34016  public/CARBOY_V14.html' | sha256sum -c -

      - name: Verify real WebGL renderer, not pseudo title
        run: |
          set -euo pipefail
          grep -Fq 'const DATA={"glyphs"' public/CARBOY_V14.html
          grep -Fq 'canvas.getContext("webgl"' public/CARBOY_V14.html
          grep -Fq 'gl.drawElements(gl.TRIANGLES' public/CARBOY_V14.html
          grep -Fq 'impactCloudlet' public/CARBOY_V14.html
          grep -Fq '/CARBOY_V14.html' src/ui/titleScreen.ts
          grep -Fq 'Swipe up to start.' src/ui/titleScreen.ts
          if grep -Eq 'carboyV14Letter|pseudo-extrud|text-shadow:.*#f5f6f7' src/ui/titleScreen.ts; then
            echo 'Pseudo title implementation is still present' >&2
            exit 1
          fi
          grep -Fq 'audio.unlock();' src/main.ts
          grep -Fq 'audio.music.playIntro();' src/main.ts

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build production
        run: |
          set -euo pipefail
          npm ci
          npm run build
          test -f dist/CARBOY_V14.html
          grep -Fq 'canvas.getContext("webgl"' dist/CARBOY_V14.html
          grep -Fq 'gl.drawElements(gl.TRIANGLES' dist/CARBOY_V14.html
          grep -Fq 'impactCloudlet' dist/CARBOY_V14.html

      - name: Refresh checked-in standalone artifact
        run: cp dist/carboy-artifact.html public/carboy-artifact.html

      - name: Commit exact V14 production splash to main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/CARBOY_V14.html public/carboy-artifact.html
          if git diff --cached --quiet; then
            echo 'Exact V14 production assets already match main.'
          else
            git commit -m 'Ship exact CARBOY V14 WebGL splash'
            git push origin HEAD:main
          fi
